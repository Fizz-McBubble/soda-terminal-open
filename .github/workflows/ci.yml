name: Public source checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm source:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node deploy/cloudflare/smoke.mjs
